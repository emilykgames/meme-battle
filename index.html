<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meme Battle</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ff4ecd,
                    #7c3aed,
                    #2563eb
                );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .game {

            width: 100%;
            max-width: 900px;

            background:
                rgba(15, 15, 30, 0.96);

            border:
                4px solid white;

            border-radius: 30px;

            padding: 35px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.4);
        }

        .logo {

            text-align: center;

            font-size: 52px;

            font-weight: 900;

            margin-bottom: 5px;

            transform:
                rotate(-2deg);

            text-shadow:
                5px 5px 0 #ff4ecd;
        }

        .subtitle {

            text-align: center;

            font-size: 18px;

            margin-bottom: 35px;

            color: #ddd;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h2 {

            text-align: center;

            font-size: 32px;
        }

        input {

            width: 100%;

            padding: 18px;

            border-radius: 15px;

            border:
                3px solid #555;

            background: #222;

            color: white;

            font-size: 20px;

            margin-bottom: 15px;

            text-align: center;
        }

        button {

            width: 100%;

            padding: 18px;

            border: none;

            border-radius: 15px;

            font-size: 20px;

            font-weight: 900;

            cursor: pointer;

            margin-top: 10px;

            transition:
                transform 0.15s;
        }

        button:hover {

            transform:
                scale(1.03)
                rotate(-1deg);
        }

        .primary {

            background: #ff4ecd;

            color: white;
        }

        .secondary {

            background: #7c3aed;

            color: white;
        }

        .green {

            background: #22c55e;

            color: white;
        }

        .room-code {

            font-size: 60px;

            font-weight: 900;

            letter-spacing: 10px;

            text-align: center;

            color: #ffeb3b;

            margin: 25px 0;
        }

        .players {

            background: #222;

            border-radius: 20px;

            padding: 20px;

            margin: 20px 0;
        }

        .player {

            background: #333;

            border-radius: 12px;

            padding: 12px;

            margin: 8px 0;

            font-size: 18px;
        }

        .player-count {

            text-align: center;

            color: #aaa;

            margin-top: 15px;
        }

        .error {

            background: #7f1d1d;

            border:
                2px solid #ef4444;

            padding: 15px;

            border-radius: 12px;

            margin-top: 15px;

            display: none;

            text-align: center;
        }

        .success {

            background: #14532d;

            border:
                2px solid #22c55e;

            padding: 15px;

            border-radius: 12px;

            margin-top: 15px;

            display: none;

            text-align: center;
        }

        .note {

            text-align: center;

            color: #aaa;

            margin-top: 15px;
        }

    </style>

</head>


<body>


<div class="game">


    <div class="logo">

        😂 MEME BATTLE 😂

    </div>


    <div class="subtitle">

        Make memes. Destroy friendships. Win glory.

    </div>


    <!-- HOME -->

    <div
        id="home"
        class="screen active"
    >

        <h2>
            🔥 Ready to Battle?
        </h2>


        <button
            class="primary"
            onclick="showScreen('create')"
        >
            🎮 CREATE GAME
        </button>


        <button
            class="secondary"
            onclick="showScreen('join')"
        >
            🚪 JOIN GAME
        </button>

    </div>


    <!-- CREATE -->

    <div
        id="create"
        class="screen"
    >

        <h2>
            🎮 Create Your Game
        </h2>


        <input
            id="hostName"
            type="text"
            placeholder="Your nickname"
            maxlength="15"
        >


        <button
            class="primary"
            onclick="createGame()"
        >
            CREATE ROOM 🚀
        </button>


        <button
            class="secondary"
            onclick="showScreen('home')"
        >
            ← BACK
        </button>


        <div
            id="createError"
            class="error"
        ></div>

    </div>


    <!-- JOIN -->

    <div
        id="join"
        class="screen"
    >

        <h2>
            🚪 Join A Game
        </h2>


        <input
            id="playerName"
            type="text"
            placeholder="Your nickname"
            maxlength="15"
        >


        <input
            id="roomInput"
            type="text"
            placeholder="4-character room code"
            maxlength="4"
        >


        <button
            class="primary"
            onclick="joinGame()"
        >
            JOIN BATTLE 🔥
        </button>


        <button
            class="secondary"
            onclick="showScreen('home')"
        >
            ← BACK
        </button>


        <div
            id="joinError"
            class="error"
        ></div>

    </div>


    <!-- LOBBY -->

    <div
        id="lobby"
        class="screen"
    >

        <h2>
            🔥 GAME LOBBY
        </h2>


        <div
            style="text-align:center"
        >
            Room Code:
        </div>


        <div
            class="room-code"
            id="roomCode"
        >
            ----
        </div>


        <div class="note">

            Give this code to your friends!

        </div>


        <div class="players">

            <h3>
                👥 Players
            </h3>


            <div id="playerList">

                Loading players...

            </div>


            <div
                class="player-count"
                id="playerCount"
            >
                0 / 10 players
            </div>

        </div>


        <button
            id="startButton"
            class="green"
            onclick="startGame()"
        >
            START GAME 🚀
        </button>


        <div class="note">

            The host controls when the game starts.

        </div>


        <div
            id="lobbyError"
            class="error"
        ></div>

    </div>


</div>


<script>


/*
==================================================
SUPABASE CONNECTION
==================================================
*/


const SUPABASE_URL =
    "https://cskoszzabrdvjtkkgnxo.supabase.co";


const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNza29zenphYnJkdmp0a2tnbnhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MDMxNDUsImV4cCI6MjEwNDQ3OTE0NX0.tCoaeII18T85fL8s_ugJLUWvla6TQ1VUaqCF2XwN8c4";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/*
==================================================
GAME VARIABLES
==================================================
*/


let currentRoom = null;

let currentPlayer = null;

let isHost = false;

let realtimeChannel = null;


/*
==================================================
SCREEN MANAGEMENT
==================================================
*/


function showScreen(screenId) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    document
        .getElementById(screenId)
        .classList.add("active");

}


/*
==================================================
ROOM CODE
==================================================
*/


function generateRoomCode() {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let code = "";


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        code +=
            characters.charAt(
                Math.floor(
                    Math.random() *
                    characters.length
                )
            );

    }


    return code;

}


/*
==================================================
CREATE GAME
==================================================
*/


async function createGame() {

    const name =
        document
            .getElementById("hostName")
            .value
            .trim();


    if (!name) {

        showError(
            "createError",
            "Enter your nickname first!"
        );

        return;

    }


    hideError("createError");


    let roomCode;

    let room;

    let attempts = 0;


    /*
    Generate a unique room code.
    */

    while (
        !room &&
        attempts < 10
    ) {

        roomCode =
            generateRoomCode();


        const result =
            await supabaseClient
                .from("rooms")
                .insert({

                    code:
                        roomCode,

                    max_players:
                        10,

                    meme_time:
                        60,

                    status:
                        "lobby"

                })
                .select()
                .single();


        if (
            !result.error
        ) {

            room =
                result.data;

        }


        attempts++;

    }


    if (!room) {

        showError(
            "createError",
            "Couldn't create a room. Check your Supabase setup."
        );

        console.error(
            "Room creation failed."
        );

        return;

    }


    /*
    Create the host player.
    */

    const playerResult =
        await supabaseClient
            .from("players")
            .insert({

                room_id:
                    room.id,

                name:
                    name,

                is_host:
                    true

            })
            .select()
            .single();


    if (
        playerResult.error
    ) {

        showError(
            "createError",
            "Room created, but we couldn't add you as host."
        );

        console.error(
            playerResult.error
        );

        return;

    }


    currentRoom =
        room;

    currentPlayer =
        playerResult.data;

    isHost = true;


    /*
    Show lobby.
    */

    document
        .getElementById("roomCode")
        .textContent =
            room.code;


    showScreen("lobby");


    /*
    Start listening for players.
    */

    setupRealtime();

    loadPlayers();

}


/*
==================================================
JOIN GAME
==================================================
*/


async function joinGame() {

    const name =
        document
            .getElementById("playerName")
            .value
            .trim();


    const code =
        document
            .getElementById("roomInput")
            .value
            .trim()
            .toUpperCase();


    if (!name) {

        showError(
            "joinError",
            "Enter your nickname first!"
        );

        return;

    }


    if (
        code.length !== 4
    ) {

        showError(
            "joinError",
            "Room codes are exactly 4 characters."
        );

        return;

    }


    hideError("joinError");


    /*
    Find room.
    */

    const roomResult =
        await supabaseClient
            .from("rooms")
            .select("*")
            .eq(
                "code",
                code
            )
            .maybeSingle();


    if (
        roomResult.error
    ) {

        console.error(
            roomResult.error
        );

        showError(
            "joinError",
            "There was a problem finding that room."
        );

        return;

    }


    if (
        !roomResult.data
    ) {

        showError(
            "joinError",
            "That room doesn't exist."
        );

        return;

    }


    const room =
        roomResult.data;


    if (
        room.status !== "lobby"
    ) {

        showError(
            "joinError",
            "That game has already started."
        );

        return;

    }


    /*
    Check player count.
    */

    const countResult =
        await supabaseClient
            .from("players")
            .select(
                "*",
                {
                    count: "exact",
                    head: true
                }
            )
            .eq(
                "room_id",
                room.id
            );


    if (
        countResult.count >=
        room.max_players
    ) {

        showError(
            "joinError",
            "That room is full!"
        );

        return;

    }


    /*
    Add player.
    */

    const playerResult =
        await supabaseClient
            .from("players")
            .insert({

                room_id:
                    room.id,

                name:
                    name,

                is_host:
                    false

            })
            .select()
            .single();


    if (
        playerResult.error
    ) {

        console.error(
            playerResult.error
        );

        showError(
            "joinError",
            "Couldn't join the room."
        );

        return;

    }


    currentRoom =
        room;

    currentPlayer =
        playerResult.data;

    isHost = false;


    document
        .getElementById("roomCode")
        .textContent =
            room.code;


    /*
    Hide start button for non-hosts.
    */

    document
        .getElementById("startButton")
        .style.display =
            "none";


    showScreen("lobby");


    setupRealtime();

    loadPlayers();

}


/*
==================================================
LOAD PLAYERS
==================================================
*/


async function loadPlayers() {

    if (!currentRoom) {
        return;
    }


    const result =
        await supabaseClient
            .from("players")
            .select("*")
            .eq(
                "room_id",
                currentRoom.id
            )
            .order(
                "joined_at",
                {
                    ascending: true
                }
            );


    if (
        result.error
    ) {

        console.error(
            result.error
        );

        return;

    }


    const players =
        result.data;


    const playerList =
        document.getElementById(
            "playerList"
        );


    playerList.innerHTML = "";


    players.forEach(
        player => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "player";


            let hostText =
                "";


            if (
                player.is_host
            ) {

                hostText =
                    " 👑 HOST";

            }


            div.textContent =
                "🟢 " +
                player.name +
                hostText;


            playerList.appendChild(
                div
            );

        }
    );


    document
        .getElementById("playerCount")
        .textContent =
            players.length +
            " / 10 players";

}


/*
==================================================
REALTIME
==================================================
*/


function setupRealtime() {

    if (
        realtimeChannel
    ) {

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

    }


    realtimeChannel =
        supabaseClient
            .channel(
                "room-" +
                currentRoom.id
            );


    realtimeChannel
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "players",
                filter:
                    "room_id=eq." +
                    currentRoom.id
            },
            payload => {

                console.log(
                    "Player update:",
                    payload
                );


                loadPlayers();

            }
        )
        .on(
            "postgres_changes",
            {
                event: "UPDATE",
                schema: "public",
                table: "rooms",
                filter:
                    "id=eq." +
                    currentRoom.id
            },
            payload => {

                console.log(
                    "Room update:",
                    payload
                );


                if (
                    payload.new.status ===
                    "playing"
                ) {

                    alert(
                        "🔥 THE GAME IS STARTING!"
                    );

                }

            }
        )
        .subscribe(
            status => {

                console.log(
                    "Realtime status:",
                    status
                );

            }
        );

}


/*
==================================================
START GAME
==================================================
*/


async function startGame() {

    if (!isHost) {

        return;

    }


    if (!currentRoom) {

        return;

    }


    const result =
        await supabaseClient
            .from("rooms")
            .update({

                status:
                    "playing"

            })
            .eq(
                "id",
                currentRoom.id
            );


    if (
        result.error
    ) {

        console.error(
            result.error
        );

        showError(
            "lobbyError",
            "Couldn't start the game."
        );

        return;

    }


    alert(
        "🔥 GAME STARTED! Next we'll build the meme creation screen."
    );

}


/*
==================================================
ERROR HELPERS
==================================================
*/


function showError(
    elementId,
    message
) {

    const element =
        document.getElementById(
            elementId
        );


    element.textContent =
        message;


    element.style.display =
        "block";

}


function hideError(
    elementId
) {

    const element =
        document.getElementById(
            elementId
        );


    element.style.display =
        "none";

}


</script>


</body>

</html>
